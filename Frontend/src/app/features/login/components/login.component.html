<div class="page page-centered">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="title mb-6">Sign in</h1>

    <label class="field">
      <span class="field-label">Email</span>
      <input class="field-input" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field-error">Enter a valid email address.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Password</span>
      <input class="field-input" type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">Enter your password.</span>
      }
    </label>

    @if (errorMessage(); as message) {
      <p class="alert-error">{{ message }}</p>
    }

    <button class="button-primary w-full" type="submit" [disabled]="form.invalid || isSubmitting()">
      {{ isSubmitting() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="subtitle mt-4">No account yet? <a class="underline" routerLink="/register">Create one</a></p>
  </form>
</div>
