<div class="page page-centered">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="title mb-6">Create account</h1>

    <label class="field">
      <span class="field-label">Name</span>
      <input class="field-input" type="text" formControlName="name" autocomplete="name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <span class="field-error">Enter your name.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Email</span>
      <input class="field-input" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field-error">Enter a valid email address.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Password</span>
      <input class="field-input" type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">Use at least 8 characters, including a number and a symbol.</span>
      }
    </label>

    @if (errorMessage(); as message) {
      <p class="alert-error">{{ message }}</p>
    }

    <button class="button-primary w-full" type="submit" [disabled]="form.invalid || isSubmitting()">
      {{ isSubmitting() ? 'Creating…' : 'Create account' }}
    </button>
  </form>
</div>
