<div class="page">
  <div class="container-narrow">
    <header class="row-between mb-8">
      <div>
        <p class="subtitle">Smart Room</p>
        <h1 class="title">Welcome{{ name() ? ', ' + name() : '' }}</h1>
      </div>

      @if (isSignedIn()) {
        <button class="button-secondary" type="button" (click)="signOut()">Sign out</button>
      } @else {
        <a class="button-primary" routerLink="/register">Register</a>
      }
    </header>

    @if (isSignedIn()) {
      <a class="button-primary" routerLink="/room">Go to the room dashboard</a>
    }
  </div>
</div>
